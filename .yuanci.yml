version: v1
name: yuanplan-verify
triggers:
  - event: push
  - event: pull_request
stages:
  - name: verify
    jobs:
      - name: application
        # Build deploy/automation/Dockerfile.ci and load this tag on every Runner.
        image: yuanplan-ci:node22-pg17
        timeout: 30m
        runs_on:
          os: linux
          executor: docker
        resources:
          cpu: "2"
          memory: 4Gi
          pids: 512
          disk: 8GiB
        environment:
          CI: "true"
          TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@db:5432/yuanplan_ci_test
        services:
          - name: db
            image: yuanplan-db:pg17
            environment:
              POSTGRES_DB: yuanplan_ci_test
              POSTGRES_PASSWORD: disposable-ci-only
        steps:
          - name: verify
            commands:
              - node scripts/ci/verify.mjs
