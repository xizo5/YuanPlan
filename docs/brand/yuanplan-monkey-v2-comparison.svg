  <text x="117" y="449" fill="#25362C" font-family="Arial,sans-serif" font-size="20" font-weight="700">YuanPlan</text>
  <text x="76" y="510" fill="#75847B" font-family="Arial,sans-serif" font-size="14">表情更克制，偏工具感</text>

  <rect x="494" y="126" width="418" height="418" rx="16" fill="#fff" stroke="#DFE8E2"/>
  <text x="522" y="166" fill="#25362C" font-family="Arial,sans-serif" font-size="22" font-weight="700">可爱版</text>
