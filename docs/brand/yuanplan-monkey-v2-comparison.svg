  <rect width="960" height="590" fill="#F6F8F7"/>
  <text x="48" y="64" fill="#25362C" font-family="Arial,sans-serif" font-size="28" font-weight="700">YuanPlan · 几何小猿改版</text>
  <text x="48" y="93" fill="#73827B" font-family="Arial,sans-serif" font-size="15">在原有深绿色和轮廓上，增加更柔和的表情</text>

  <rect x="48" y="126" width="418" height="418" rx="16" fill="#fff" stroke="#DFE8E2"/>
