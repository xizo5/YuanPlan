      <ellipse cx="48" cy="65" rx="12" ry="9" fill="#fff"/>
      <circle cx="39" cy="51" r="4" fill="#25634E"/><circle cx="57" cy="51" r="4" fill="#25634E"/>
      <circle cx="38" cy="49.5" r="1.3" fill="#fff"/><circle cx="56" cy="49.5" r="1.3" fill="#fff"/>
      <circle cx="34" cy="61" r="3" fill="#EFB4A3"/><circle cx="62" cy="61" r="3" fill="#EFB4A3"/>
