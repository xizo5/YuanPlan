  <text x="563" y="449" fill="#25362C" font-family="Arial,sans-serif" font-size="20" font-weight="700">YuanPlan</text>
  <text x="522" y="510" fill="#2D7257" font-family="Arial,sans-serif" font-size="14">眼神、脸颊和微笑更亲和</text>
