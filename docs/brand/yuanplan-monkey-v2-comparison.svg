<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
  <title id="title">YuanPlan 几何小猿改版对比</title>
  <desc id="desc">对比第一版与可爱版小猿标志，包括大图和侧栏实际尺寸</desc>
  <defs>
