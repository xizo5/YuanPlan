<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
  <title id="title">YuanPlan 动物与机器人标志方向对比</title>
  <desc id="desc">几何小猿和 Y 天线机器人各自的大图、侧栏尺寸及品牌组合</desc>
  <defs>
    <symbol id="monkey" viewBox="0 0 96 96">
